name: MINA Local integration
on:
  push:
    branches: [feat/mina-local-etapa1-20261108]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:local
      - run: npx playwright install chromium
      - name: Linux real-server and browser checks
        if: runner.os == 'Linux'
        run: |
          python scripts/get_pocketbase.py linux_amd64 tools-pb
          python scripts/check_local.py tools-pb/pocketbase --browser
      - name: Windows real-server and browser checks
        if: runner.os == 'Windows'
        run: |
          python scripts/get_pocketbase.py windows_amd64 tools-pb
          python scripts/check_local.py tools-pb/pocketbase.exe --browser
      - run: python -m unittest discover -s local/spike -p "test_*.py" -v
      - name: Package Windows x64
        if: runner.os == 'Windows'
        run: python scripts/package_windows.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: MINA-Local-Windows-x64
          path: local-release/MINA-Local-Windows-x64.zip
          retention-days: 14
